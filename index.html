<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Клиника · Психо_Богиня</title>
<style>
:root{
  --bg:#070A14; --ink:#E9F2FF; --accent:#7FD4E8; --dim:#68788C;
  --mono:ui-monospace,'SFMono-Regular',Menlo,monospace;
  --serif:'Georgia','Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hud{position:fixed;padding:12px 16px;border:1px solid rgba(159,196,232,.18);border-radius:12px;
  background:rgba(7,10,20,.82);backdrop-filter:blur(8px);font-family:var(--mono);line-height:1.75}
#top{top:14px;left:14px;min-width:200px}
#top .nm{font-size:15px;letter-spacing:.06em;color:var(--accent)}
#top .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#side{top:14px;right:14px;min-width:190px;text-align:right}
#side .bill{font-size:17px;letter-spacing:.04em;color:var(--ink)}
#side .cnt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#help{bottom:14px;left:50%;transform:translateX(-50%);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);text-align:center;white-space:nowrap}
#help b{color:var(--accent);font-weight:400}
#msg{position:fixed;left:50%;bottom:74px;transform:translate(-50%,10px);max-width:min(90%,560px);
  padding:14px 18px;border-radius:12px;border:1px solid rgba(159,196,232,.22);border-left:2px solid var(--accent);
  background:rgba(7,10,20,.94);font-family:var(--serif);font-size:17px;line-height:1.45;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease}
#msg.on{opacity:1;transform:translate(-50%,0)}
#msg .who{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);margin-bottom:6px}
#map{position:fixed;left:14px;bottom:14px;padding:10px 12px;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;color:var(--dim);background:rgba(7,10,20,.8);border:1px solid rgba(159,196,232,.14);
  border-radius:10px;line-height:1.7;max-width:46vw}
#map a{color:var(--dim);text-decoration:none;cursor:pointer;display:inline-block;margin-right:9px}
#map a:hover{color:var(--accent)}
#fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:9}
#fade.on{opacity:1}
#warn{position:fixed;top:14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:#f0c070;background:rgba(7,10,20,.9);
  padding:9px 14px;border-radius:8px;border:1px solid rgba(240,192,112,.35);display:none;z-index:10}
@media (max-width:760px){
  #top,#side{position:fixed;top:auto;bottom:auto}
  #top{top:10px;left:10px;padding:8px 11px;min-width:0}
  #side{top:10px;right:10px;padding:8px 11px;min-width:0}
  #map{display:none}
  #help{font-size:9.5px;bottom:10px}
  #msg{bottom:52px;font-size:15px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="top">
  <div class="nm" id="rname">КОРИДОР</div>
  <div class="sub" id="rpal">голубо-серый</div>
</div>

<div class="hud" id="side">
  <div class="bill" id="bill">0 ₽</div>
  <div class="cnt" id="cnt">найдено 0 из 0</div>
</div>

<div class="hud" id="map"></div>
<div id="msg"></div>
<div id="help"><b>WASD / стрелки</b> — идти · <b>E</b> — войти · <b>мышь</b> — нажать · <b>M</b> — карта</div>
<div id="fade"></div>
<div id="warn"></div>

<script>
(function(){
"use strict";
var d=document, w=window;
var cv=d.getElementById('cv'), ctx=cv.getContext('2d');
var DATA=null, ROOM=null, PAL={};
var roomId='corridor', px=0, py=0, keys={}, mouse={x:0,y:0,down:false};
var bill=0, found={}, totalItems=0, lastDir=0, dirChanges=0, trapShift=0, trapMirror=false, msgT=null;
var imgs={}, spr={};
var saved=JSON.parse(localStorage.getItem('clinic_state')||'{}');
if(saved.bill) bill=saved.bill;
if(saved.found) found=saved.found;

function fit(){ cv.width=innerWidth; cv.height=innerHeight; }
addEventListener('resize',fit); fit();

/* ---------- загрузка ---------- */
fetch('data/rooms.json').then(function(r){return r.json();}).then(function(j){
  DATA=j; PAL=j.palettes; ROOM=j.rooms[0]; roomId=ROOM.id;
  j.rooms.forEach(function(r){ totalItems += (r.items||[]).length; });
  /* подгружаем фоны и спрайты */
  var jobs=[];
  j.rooms.forEach(function(r){
    if(r.bg) jobs.push(load(r.bg,function(im){imgs[r.bg]=im;}));
    (r.decor||[]).forEach(function(dc){ jobs.push(load(dc.src,function(im){spr[dc.src]=im;})); });
    (r.anim||[]).forEach(function(dc){ jobs.push(load(dc.src,function(im){spr[dc.src]=im;})); });
  });
  Object.keys(j.rooms).forEach(function(k){
    (j.rooms[k].items||[]).forEach(function(it){ if(it.sprite) jobs.push(load(it.sprite,function(im){spr[it.sprite]=im;})); });
  });
  Promise.all(jobs).then(function(){ start(); });
}).catch(function(e){
  d.getElementById('warn').style.display='block';
  d.getElementById('warn').textContent='не удалось загрузить data/rooms.json';
});
function load(src,cb){ return new Promise(function(res){ var im=new Image(); im.onload=function(){cb(im);res();}; im.onerror=function(){res();}; im.src=src; }); }

function roomById(id){ for(var i=0;i<DATA.rooms.length;i++) if(DATA.rooms[i].id===id) return DATA.rooms[i]; return null; }
function pal(){ return PAL[ROOM.pal]||PAL.steel; }

/* ---------- ввод ---------- */
addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  keys[k]=1;
  if(k==='e'||k===' '||k==='enter'){ e.preventDefault(); interact(); }
  if(k==='m'){ var m=d.getElementById('map'); m.style.display=m.style.display==='block'?'none':'block'; }
});
addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=0; });
cv.addEventListener('mousemove',function(e){ var r=cv.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; });
cv.addEventListener('mousedown',function(){ mouse.down=true; });
cv.addEventListener('mouseup',function(){ if(mouse.down){ mouse.down=false; interact(); } });

/* ---------- геометрия ---------- */
function geom(){
  var s=Math.min(cv.width/(ROOM.w+2), cv.height/(ROOM.h+2));
  s=Math.min(s, 46);
  return { s:s, ox:(cv.width-ROOM.w*s)/2, oy:(cv.height-ROOM.h*s)/2 };
}
function hitWall(nx,ny){
  if(nx<0.55||ny<0.55||nx>ROOM.w-0.55||ny>ROOM.h-0.55) return true;
  var W=ROOM.walls||[];
  for(var i=0;i<W.length;i++){ var w2=W[i];
    if(nx>w2[0]-0.34&&nx<w2[0]+w2[2]+0.34&&ny>w2[1]-0.34&&ny<w2[1]+w2[3]+0.34) return true; }
  return false;
}
function nearDoor(){
  var best=null, bd=1e9;
  (ROOM.doors||[]).forEach(function(dr){
    var dist=Math.hypot(dr.x-px,dr.y-py);
    if(dist<bd){bd=dist;best=dr;}
  });
  return bd<2.2?{d:best,dist:bd}:null;
}
function nearAnim(){
  var best=null,bd=1e9;
  (ROOM.anim||[]).forEach(function(dc){
    var dist=Math.hypot(dc.x-px,dc.y-py);
    if(dist<bd){bd=dist;best=dc;}
  });
  return bd<2.0?{dc:best,dist:bd}:null;
}
function nearItem(){
  var best=null,bd=1e9;
  (ROOM.items||[]).forEach(function(it){
    var dist=Math.hypot(it.x-px,it.y-py);
    if(dist<bd){bd=dist;best=it;}
  });
  return bd<1.7?{i:best,dist:bd}:null;
}

/* ---------- переходы ---------- */
function go(id){
  var r=roomById(id); if(!r) return;
  d.getElementById('fade').classList.add('on');
  setTimeout(function(){
    roomId=id; ROOM=r;
    var sp=(r.spawn)||null;
    if(sp){ px=sp[0]; py=sp[1]; }
    else {
      var back=(r.doors||[]).filter(function(x){return x.to===lastRoom;})[0];
      if(back){ px=back.x; py=back.y; } else { px=ROOM.w/2; py=ROOM.h/2; }
    }
    d.getElementById('rname').textContent=ROOM.name+(ROOM.placeholder?' · заготовка':'');
    d.getElementById('rpal').textContent=(PAL[ROOM.pal]||{}).name||ROOM.pal;
    d.getElementById('fade').classList.remove('on');
    buildMap();
  },460);
}
var lastRoom='corridor';

function interact(){
  var na=nearAnim();
  if(na){ if(!na.dc._hit){ na.dc._hit=1; say(na.dc.trigger,na.dc.rose,na.dc.name); } return; }
  var ni=nearItem();
  if(ni){ trigger(ni.i); return; }
  var nd=nearDoor();
  if(nd){ lastRoom=roomId; go(nd.d.to); return; }
  say('Здесь ничего нет. Или ты стоишь не там.',false);
}

/* ---------- предметы и триггеры ---------- */
function trigger(it){
  if(it.sprite&&!spr[it.sprite]) load(it.sprite,function(im){spr[it.sprite]=im;});
  if(!found[it.id]){ found[it.id]=1; bill+=it.bill||0; save(); }
  say(it.trigger||it.name, it.rose, it.name);
}
function save(){
  localStorage.setItem('clinic_state',JSON.stringify({bill:bill,found:found}));
}
function say(txt,rose,name){
  var m=d.getElementById('msg');
  m.innerHTML=(name?'<span class="who">'+name+'</span>':'')+txt;
  m.style.borderLeftColor=rose?'#C4666B':'#7FD4E8';
  m.classList.add('on');
  clearTimeout(msgT); msgT=setTimeout(function(){ m.classList.remove('on'); },5200);
}
function buildMap(){
  var m=d.getElementById('map'); if(!m) return;
  m.innerHTML='<span style="color:#7FD4E8">КАРТА</span><br>'+DATA.rooms.map(function(r){
    return '<a data-r="'+r.id+'">'+r.name.replace(/^ПАЛАТА /,'')+'</a>';}).join('');
  m.querySelectorAll('a').forEach(function(a){ a.onclick=function(){ lastRoom=roomId; go(a.getAttribute('data-r')); }; });
}

/* ---------- ловушка коридора ---------- */
function trapLogic(){
  if(ROOM.kind!=='trap') return;
  var dir=lastDir;
  if(dir&&dir!==lastDir){ dirChanges++; if(dirChanges>=3){ dirChanges=0; shiftTrap(); } }
}
function shiftTrap(){
  /* Коридор-ловушка: двери меняются местами ВНУТРИ одной стороны, фон ползёт и
     переворачивается. Куда ведёт каждая дверь — не меняется: выйти можно всегда,
     выбраться «нельзя» только психологически — ты теряешь ориентацию. */
  var sides={};
  (ROOM.doors||[]).forEach(function(dr){ (sides[dr.side]=sides[dr.side]||[]).push(dr); });
  Object.keys(sides).forEach(function(sd){
    var arr=sides[sd]; if(arr.length<2) return;
    var sh=arr.slice();
    for(var i=sh.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=sh[i]; sh[i]=sh[j]; sh[j]=t; }
    sh.forEach(function(dr,i){ dr.x=arr[i].x; dr.y=arr[i].y; });
  });
  trapShift=(trapShift+1)%4;
  trapMirror=!trapMirror;
  say('Коридор изменился. Ты помнил, куда шёл?');
}

/* ---------- отрисовка ---------- */
function draw(){
  var g=geom(), P=pal();
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle=P.floor; ctx.fillRect(0,0,cv.width,cv.height);

  /* подложка-панорама */
  if(ROOM.bg&&imgs[ROOM.bg]){
    var im=imgs[ROOM.bg], iw=im.width, ih=im.height;
    var sc=Math.max((ROOM.w*g.s)/iw,(ROOM.h*g.s)/ih);
    var dw=iw*sc, dh=ih*sc;
    var dx=g.ox+(ROOM.w*g.s-dw)/2 + (trapShift?trapShift*26:0), dy=g.oy+(ROOM.h*g.s-dh)/2;
    ctx.save(); ctx.globalAlpha=0.85;
    if(trapMirror){ ctx.translate(g.ox+ROOM.w*g.s, g.oy); ctx.scale(-1,1); ctx.drawImage(im,dx-g.ox-ROOM.w*g.s,dy,dw,dh); }
    else ctx.drawImage(im,dx,dy,dw,dh);
    ctx.restore();
    /* тонировка палитрой комнаты */
    ctx.save(); ctx.globalCompositeOperation='multiply';
    ctx.fillStyle=P.tint; ctx.globalAlpha=0.55;
    ctx.fillRect(g.ox,g.oy,ROOM.w*g.s,ROOM.h*g.s); ctx.restore();
  }
  /* пол комнаты */
  ctx.save(); ctx.globalAlpha=0.55;
  ctx.fillStyle=P.floor; ctx.fillRect(g.ox,g.oy,ROOM.w*g.s,ROOM.h*g.s); ctx.restore();

  /* стены */
  (ROOM.walls||[]).forEach(function(w2){
    ctx.fillStyle=P.wall; ctx.globalAlpha=0.86;
    ctx.fillRect(g.ox+w2[0]*g.s,g.oy+w2[1]*g.s,w2[2]*g.s,w2[3]*g.s);
    ctx.globalAlpha=1; ctx.strokeStyle=P.edge; ctx.lineWidth=1.2;
    ctx.strokeRect(g.ox+w2[0]*g.s,g.oy+w2[1]*g.s,w2[2]*g.s,w2[3]*g.s);
  });

  /* двери */
  (ROOM.doors||[]).forEach(function(dr){
    var x=g.ox+dr.x*g.s, y=g.oy+dr.y*g.s;
    var pulse=0.55+0.45*Math.sin(Date.now()/520);
    ctx.save(); ctx.globalAlpha=pulse;
    ctx.strokeStyle=P.glow; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.arc(x,y,15,0,7); ctx.stroke();
    ctx.globalAlpha=0.28; ctx.fillStyle=P.glow;
    ctx.beginPath(); ctx.arc(x,y,11,0,7); ctx.fill();
    ctx.restore();
    ctx.font='10px ui-monospace,monospace'; ctx.fillStyle=P.glow; ctx.textAlign='center';
    ctx.fillText(dr.label||'',x,y-21);
  });

  /* декор: статичные элементы комнаты (метла, дымка, аппаратура) */
  (ROOM.decor||[]).forEach(function(dc){
    var im=spr[dc.src]; if(!im) return;
    var hh=(dc.h||20)*g.s/100*10, ww=(dc.w||null);
    var sc=hh/im.height, w2=im.width*sc;
    if(ww) { sc=ww/im.width; w2=ww; hh=im.height*sc; }
    ctx.drawImage(im, g.ox+dc.x*g.s-w2/2, g.oy+dc.y*g.s-hh, w2, hh);
  });

  /* анимации: гиф/стикеры, по клику — реплика */
  (ROOM.anim||[]).forEach(function(dc){
    var im=spr[dc.src]; if(!im) return;
    var hh=(dc.h||20)*g.s/100*10, sc=hh/im.height, w2=im.width*sc;
    ctx.save(); ctx.globalAlpha=dc.alpha===undefined?0.92:dc.alpha;
    ctx.drawImage(im, g.ox+dc.x*g.s-w2/2, g.oy+dc.y*g.s-hh, w2, hh); ctx.restore();
    if(dc.trigger) dc._el=dc;
  });

  /* предметы */
  (ROOM.items||[]).forEach(function(it){
    var x=g.ox+it.x*g.s, y=g.oy+it.y*g.s, h=(it.h||14)*g.s/100*10;
    if(spr[it.sprite]){
      var im=spr[it.sprite], sc=h/im.height;
      ctx.drawImage(im,x-im.width*sc/2,y-im.height*sc,im.width*sc,im.height*sc);
    } else {
      ctx.save(); ctx.globalAlpha=.9; ctx.fillStyle=P.glow;
      ctx.beginPath(); ctx.arc(x,y,h*0.28,0,7); ctx.fill(); ctx.restore();
    }
  });

  /* игрок */
  var pxp=g.ox+px*g.s, pyp=g.oy+py*g.s;
  var halo=ctx.createRadialGradient(pxp,pyp,0,pxp,pyp,26);
  halo.addColorStop(0,'rgba(127,212,232,.55)'); halo.addColorStop(1,'rgba(127,212,232,0)');
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(pxp,pyp,26,0,7); ctx.fill();
  ctx.fillStyle='#EAF7FF'; ctx.beginPath(); ctx.arc(pxp,pyp,6.5,0,7); ctx.fill();
  ctx.strokeStyle=P.glow; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(pxp,pyp,10,0,7); ctx.stroke();

  /* отладочный хук: позиция игрока (для тестов и отладки) */
  window.__p={x:px,y:py,room:roomId};

  /* счёт */
  d.getElementById('bill').textContent=bill.toLocaleString('ru-RU')+' ₽';
  d.getElementById('cnt').textContent='найдено '+Object.keys(found).length+' из '+totalItems;

  requestAnimationFrame(draw);
}

/* ---------- игровой цикл ---------- */
function step(){
  var dx=0,dy=0;
  if(keys['a']||keys['arrowleft'])dx=-1;
  if(keys['d']||keys['arrowright'])dx=1;
  if(keys['w']||keys['arrowup'])dy=-1;
  if(keys['s']||keys['arrowdown'])dy=1;
  if(dx||dy){
    var sp=0.13;
    var nx=px+dx*sp, ny=py+dy*sp;
    if(!hitWall(nx,py)) px=nx;
    if(!hitWall(px,ny)) py=ny;
    var nd=dx?(dx>0?'r':'l'):(dy>0?'d':'u');
    if(nd!==lastDir){ lastDir=nd; trapLogic(); }
  }
  requestAnimationFrame(step);
}

function start(){
  ROOM=roomById('corridor')||DATA.rooms[0];
  px=ROOM.w/2; py=ROOM.h/2;
  d.getElementById('rname').textContent=ROOM.name;
  d.getElementById('rpal').textContent=(PAL[ROOM.pal]||{}).name||ROOM.pal;
  buildMap(); step(); draw();
}
})();
</script>
</body>
</html>
